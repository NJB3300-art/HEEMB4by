<style>
  :root {
    --bg: #101216;
    --bg-2: #171a20;
    --bg-3: #20242c;
    --bg-4: #2a2f39;
    --line: #2f3440;
    --text: #eef0f4;
    --dim: #a3a9b6;
    --accent: #ffd23f;
    --accent-ink: #1a1500;
    --hot: #ff5d8f;
    --cool: #44d3c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Outfit, system-ui, sans-serif; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The picture fills the screen; everything else floats over it or slides out from the edges. */
  .app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
  .glass { background: rgba(23,26,32,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: 0 10px 34px rgba(0,0,0,0.35); }

  /* top bar */
  .top { position: absolute; top: 10px; left: 82px; right: 10px; height: 52px; z-index: 20; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 10px; min-width: 0; }
  .logo { font-weight: 800; font-size: 21px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--hot)); display: inline-block; }
  .proj { height: 34px; width: 170px; max-width: 26vw; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
  .grow { flex: 1; }
  .credit { font-size: 12px; font-weight: 600; color: var(--dim); text-decoration: none; padding: 4px 6px; border-radius: 7px; white-space: nowrap; }
  .credit:hover { color: var(--accent); background: var(--bg-3); }
  .btn {
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg-3); display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-4); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { background: #ffdd66; }
  .btn.icon { padding: 0; width: 36px; }
  .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .status { font-size: 13px; color: var(--dim); white-space: nowrap; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* tools */
  .tools { position: absolute; top: 10px; left: 10px; width: 62px; max-height: calc(100% - 20px); z-index: 20; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; overflow-y: auto; }
  .tool { width: 46px; height: 46px; border-radius: 12px; border: 0; background: transparent; color: var(--dim); display: grid; place-items: center; position: relative; }
  .tool svg { width: 22px; height: 22px; }
  .tool:hover { background: var(--bg-3); color: var(--text); }
  .tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tool .k { position: absolute; right: 4px; bottom: 2px; font-size: 10px; opacity: 0.7; }
  .tools hr { width: 32px; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .swatch-now { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--bg-4); margin-top: 6px; }

  /* viewport */
  .view { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0c0f; overflow: hidden; }
  .canvas-box { position: relative; background: #000; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,0.5); }
  .canvas-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #draw { cursor: crosshair; }
  .hud { position: absolute; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud { z-index: 10; transition: bottom 0.25s ease, right 0.25s ease; }
  .hud.tl { top: 72px; left: 82px; }
  .hud.tr { top: 72px; right: 58px; }
  .hud.bc { bottom: 54px; left: 50%; transform: translateX(-50%); }
  .app.time-open .hud.bc { bottom: 244px; }
  .app.side-open .hud.tr { right: 398px; }
  .pill { background: rgba(16,18,22,0.82); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 4px; display: flex; gap: 2px; align-items: center; }
  .pill button { height: 32px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 13px; color: var(--dim); }
  .pill button[aria-pressed="true"] { background: var(--bg-4); color: var(--text); }
  .pill .lab { font-size: 12px; color: var(--dim); padding: 0 8px; }
  .add-frame { height: 46px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .add-frame svg { width: 20px; height: 20px; }
  .cam-changed { background: var(--hot); color: #fff; border: 0; height: 36px; padding: 0 14px; border-radius: 11px; font-weight: 700; font-size: 13px; display: none; }
  .cam-changed.show { display: inline-flex; align-items: center; }
  .hop { height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(16,18,22,0.82); backdrop-filter: blur(6px); font-weight: 700; font-size: 13px; color: var(--text); }
  .hop[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff; }
  .canvas-box.hopped { box-shadow: 0 0 0 3px var(--hot), 0 20px 60px rgba(0,0,0,0.5); }
  .hop-tag { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 800; color: #fff; background: var(--hot); padding: 3px 9px; border-radius: 8px; pointer-events: none; }
  .hop-tag:empty { display: none; }
  .fly-help { font-size: 12px; color: var(--dim); background: rgba(16,18,22,0.8); padding: 6px 10px; border-radius: 10px; }
  .loading { color: var(--dim); font-weight: 600; }

  /* side panel */
  /* right drawer with tabs sticking out of its left edge */
  .side { position: absolute; top: 72px; right: 0; bottom: 54px; width: min(340px, 86vw); z-index: 30; border-radius: 16px 0 0 16px; border-right: 0; display: flex; flex-direction: column; min-height: 0; transform: translateX(100%); transition: transform 0.25s ease, bottom 0.25s ease; }
  .side.open { transform: none; }
  .app.time-open .side { bottom: 244px; }
  .side-tabs { position: absolute; top: 14px; left: -46px; display: flex; flex-direction: column; gap: 6px; }
  .side-tabs button { width: 46px; min-height: 92px; padding: 12px 0; border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; background: rgba(23,26,32,0.92); color: var(--dim); font-weight: 800; font-size: 13px; writing-mode: vertical-rl; transform: rotate(180deg); border-radius: 0 12px 12px 0; border-left: 0; border-right: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .side-tabs button:hover { color: var(--text); }
  .side.open .side-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
  .side-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .pane { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .pane.on { display: block; }
  .sect { margin-bottom: 18px; }
  .sect h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--dim); font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field .hd { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .field .hd output { color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 24px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bg-2); box-shadow: 0 0 0 1px var(--line); padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  input[type=color] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 32px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .list li { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 10px; background: var(--bg-3); border: 1px solid transparent; }
  .list li.sel { border-color: var(--accent); background: var(--bg-4); }
  .list .nm { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 6px 4px; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .nm small { color: var(--dim); font-weight: 500; margin-left: 6px; }
  .mini { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--dim); display: grid; place-items: center; flex: 0 0 auto; }
  .mini:hover { background: var(--bg-2); color: var(--text); }
  .mini svg { width: 17px; height: 17px; }
  .mini.off { opacity: 0.4; }
  .note { font-size: 13px; color: var(--dim); line-height: 1.45; }
  .drop-hint { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; font-size: 13px; color: var(--dim); }
  .chipb { height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-3); font-size: 12px; font-weight: 700; color: var(--dim); }
  .chipb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .bitem { display: flex; flex-direction: column; gap: 3px; padding: 5px; border-radius: 10px; border: 2px solid transparent; background: #f3efe6; color: #1d1a24; text-align: left; }
  .bitem.dark { background: #15171c; color: var(--text); }
  .bitem canvas { width: 100%; height: 34px; display: block; }
  .bitem span { font-size: 12px; font-weight: 700; padding: 0 2px 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bitem[aria-selected="true"] { border-color: var(--accent); }
  .bitem:hover { filter: brightness(0.97); }
  .cw { display: flex; flex-direction: column; gap: 8px; }
  .cw-top { display: flex; gap: 12px; align-items: center; }
  .cw-wheel { border-radius: 50%; cursor: crosshair; touch-action: none; flex: 0 0 auto; }
  .cw-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cw-swatch { width: 56px; height: 56px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
  .cw-hex { width: 84px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; font: 13px ui-monospace, Consolas, monospace; }
  .cw-val { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); font-weight: 600; }
  .cw-val input { -webkit-appearance: none; appearance: none; height: 14px; border-radius: 7px; margin: 0; }
  .cw-val input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #111; }
  .cw-val input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #111; }
  .cwd { margin: 6px 0 10px; border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; }
  .cwd summary { cursor: pointer; min-height: 38px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .cwd[open] { padding-bottom: 10px; }
  .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); flex: 0 0 auto; vertical-align: -3px; }
  .lightbox { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--bg-3); border: 1px solid var(--line); }
  select { height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; }

  /* timeline */
  /* bottom drawer */
  .time { position: absolute; left: 10px; right: 10px; bottom: 0; height: 232px; z-index: 25; border-radius: 16px 16px 0 0; border-bottom: 0; display: flex; flex-direction: column; min-width: 0; transform: translateY(100%); transition: transform 0.25s ease; }
  .time.open { transform: none; }
  .time-tab { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); height: 44px; padding: 0 18px; border-radius: 12px 12px 0 0; border: 1px solid var(--line); border-bottom: 0; background: rgba(23,26,32,0.92); color: var(--text); font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .time.open .time-tab { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .time-tab svg { width: 16px; height: 16px; transition: transform 0.25s; }
  .time.open .time-tab svg { transform: rotate(180deg); }
  .mini-play { height: 36px; min-width: 36px; border-radius: 11px; border: 0; background: rgba(16,18,22,0.82); color: var(--text); display: inline-grid; place-items: center; }
  .mini-play svg { width: 16px; height: 16px; }
  .tbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .tbar label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .strip { flex: 1; display: flex; gap: 8px; padding: 10px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  .frame { flex: 0 0 auto; border: 2px solid transparent; border-radius: 10px; background: var(--bg-3); padding: 3px; position: relative; }
  .frame canvas { display: block; border-radius: 7px; background: #000; }
  .frame span { position: absolute; left: 7px; top: 6px; font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 6px; }
  .frame[aria-current="true"] { border-color: var(--accent); }
  .frame.playing { border-color: var(--cool); }

  /* dialogs */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .scrim.open { display: flex; }
  .dlg { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .dlg h2 { margin: 0 0 8px; font-size: 20px; }
  .dlg p { color: var(--dim); margin: 0 0 12px; line-height: 1.45; }
  .dlg video, .dlg img { width: 100%; border-radius: 12px; background: #000; }
  .dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .dlg .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .dlg .opts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--bg-4); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
  .dropping .view::after { content: "Drop 3D files to import"; position: absolute; inset: 12px; border: 3px dashed var(--accent); border-radius: 18px; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: rgba(0,0,0,0.5); }

  @media (max-width: 900px) {
    .tools { width: 52px; }
    .top { left: 70px; }
    .hud.tl { left: 70px; }
    .app.side-open .hud.tr { right: 58px; }
    .time { height: 200px; }
    .app.time-open .hud.bc { bottom: 212px; }
    .app.time-open .side { bottom: 212px; }
    .tool { width: 42px; height: 42px; }
    .lbl { display: none; }
    .logo span { display: none; }
    .proj { width: 110px; }
    .fly-help { display: none; }
  }

  /* =====================================================================
     Frutiger Aero theme: sky, glass, gloss, bubbles, aqua and lime
     ===================================================================== */
  :root {
    --bg: #ffffff;
    --bg-2: rgba(255,255,255,0.78);
    --bg-3: rgba(232,246,255,0.9);
    --bg-4: #bfe6fb;
    --line: rgba(86,160,214,0.45);
    --text: #0b2a46;
    --dim: #3d5d7c;
    --accent: #2aa8ec;
    --accent-ink: #052d4d;
    --hot: #ff6a3d;
    --cool: #31c4d8;
    --gel-aqua: linear-gradient(180deg, #effaff 0%, #a9e2ff 46%, #6ac7f6 52%, #9fe0ff 100%);
    --gel-lime: linear-gradient(180deg, #f1ffd9 0%, #b9ef7a 46%, #7fd23a 52%, #a8ea6a 100%);
    --gel-white: linear-gradient(180deg, #ffffff 0%, #f1f9ff 46%, #dceffc 52%, #eef8ff 100%);
    --glass: linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.3) 42%, rgba(255,255,255,0) 43%), linear-gradient(180deg, rgba(244,251,255,0.86), rgba(214,238,253,0.8));
  }
  html, body { background: #bfe6ff; font-family: Hind, "Segoe UI", "Frutiger", "Helvetica Neue", system-ui, sans-serif; color: var(--text); }
  :focus-visible { outline: 3px solid #1d8fe0; outline-offset: 2px; }

  /* sky backdrop behind the picture */
  .view { background: linear-gradient(180deg, #1f8fea 0%, #5cb8f7 38%, #a8ddff 62%, #e4f6ff 78%, #e4f6ff 100%); }
  .aero-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .aero-bg .hill { position: absolute; left: -10%; right: -10%; bottom: -38%; height: 62%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0%, #c6f58a 0%, #7fd23a 28%, #3f9e1e 70%, #2d7c14 100%); box-shadow: 0 -12px 40px rgba(255,255,255,0.55); }
  .aero-bg .skyline { position: absolute; inset: 0; width: 100%; height: 100%; }
  .aero-bg .hill { z-index: 1; }
  .aero-bg .bub { z-index: 2; }
  .aero-bg .cloud { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff 0 45%, rgba(255,255,255,0) 70%); filter: blur(2px); opacity: 0.95; }
  .aero-bg .cloud::before, .aero-bg .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .aero-bg .cloud::before { width: 70%; height: 90%; left: -35%; top: 25%; }
  .aero-bg .cloud::after { width: 80%; height: 100%; right: -40%; top: 18%; }
  .aero-bg .c1 { width: 220px; height: 90px; top: 9%; left: 8%; }
  .aero-bg .c2 { width: 300px; height: 110px; top: 4%; right: 12%; }
  .aero-bg .c3 { width: 180px; height: 70px; top: 30%; left: 46%; opacity: 0.8; }
  .aero-bg .bub { position: absolute; bottom: -80px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0 9%, rgba(255,255,255,0.15) 22%, rgba(140,215,255,0.12) 55%, rgba(120,200,255,0.35) 80%, rgba(255,255,255,0.75) 96%);
    box-shadow: inset -6px -8px 18px rgba(80,170,240,0.35), 0 0 12px rgba(255,255,255,0.35);
    animation: rise linear infinite; }
  .bub.b1 { left: 6%; width: 70px; height: 70px; animation-duration: 26s; }
  .bub.b2 { left: 22%; width: 34px; height: 34px; animation-duration: 19s; animation-delay: -6s; }
  .bub.b3 { left: 74%; width: 90px; height: 90px; animation-duration: 31s; animation-delay: -12s; }
  .bub.b4 { left: 88%; width: 40px; height: 40px; animation-duration: 22s; animation-delay: -3s; }
  .bub.b5 { left: 55%; width: 26px; height: 26px; animation-duration: 17s; animation-delay: -9s; }
  .bub.b6 { left: 38%; width: 56px; height: 56px; animation-duration: 28s; animation-delay: -18s; }
  @keyframes rise { from { transform: translate(0, 0); } 50% { transform: translate(18px, -55vh); } to { transform: translate(-10px, -115vh); } }
  @media (prefers-reduced-motion: reduce) { .aero-bg .bub { animation: none; bottom: auto; top: 60%; } }

  .canvas-box { border-radius: 12px; overflow: hidden; background: #dff3ff;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.85), 0 0 0 3px rgba(60,150,220,0.35), 0 24px 60px rgba(10,70,130,0.35); }
  .canvas-box.hopped { box-shadow: 0 0 0 3px var(--hot), 0 24px 60px rgba(10,70,130,0.35); }

  /* frosted glass panels */

  [aria-pressed="true"].tool, .seg button[aria-pressed="true"], .pill button[aria-pressed="true"], .chip[aria-pressed="true"], .chipb[aria-pressed="true"],

  /* =====================================================================
     Realism pass: grain, layered shading, deeper gloss and soft shadows
     ===================================================================== */
  :root {
    --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .5  0 0 0 0 .65  0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    --glass: var(--noise),
      radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,0.95), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.18) 40%, rgba(255,255,255,0) 41%),
      linear-gradient(180deg, rgba(246,252,255,0.9) 0%, rgba(214,238,253,0.84) 70%, rgba(190,226,250,0.86) 100%);
    --gel-white: radial-gradient(90% 60% at 50% 0%, rgba(255,255,255,1), rgba(255,255,255,0) 70%),
      radial-gradient(70% 50% at 50% 110%, rgba(150,215,255,0.55), rgba(150,215,255,0) 70%),
      linear-gradient(180deg, #ffffff 0%, #eef8ff 45%, #d3ebfb 52%, #e7f5ff 100%);
    --gel-aqua: radial-gradient(90% 55% at 50% 0%, rgba(255,255,255,0.95), rgba(255,255,255,0) 72%),
      radial-gradient(70% 45% at 50% 115%, rgba(200,245,255,0.9), rgba(200,245,255,0) 70%),
      linear-gradient(180deg, #e9f8ff 0%, #8fd6ff 45%, #4fb6f0 53%, #8bd5ff 100%);
    --gel-lime: radial-gradient(90% 55% at 50% 0%, rgba(255,255,255,0.95), rgba(255,255,255,0) 72%),
      radial-gradient(70% 45% at 50% 115%, rgba(230,255,170,0.9), rgba(230,255,170,0) 70%),
      linear-gradient(180deg, #f2ffdc 0%, #b2ec70 45%, #74c92f 53%, #a4e663 100%);
  }
  .glass {
    background: var(--glass);
    border: 1px solid rgba(255,255,255,0.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 0 0 1px rgba(255,255,255,0.35),
      inset 0 -14px 26px rgba(110,180,235,0.28),
      inset 0 10px 18px rgba(255,255,255,0.35),
      0 2px 4px rgba(10,60,120,0.18),
      0 18px 44px rgba(10,60,120,0.32);
  }
  .btn, .chip, .chipb, .mini-play, .hop, .pill button, .seg button {
    position: relative;
  }
  .btn {
    box-shadow: inset 0 1px 0 #fff, inset 0 -3px 6px rgba(70,150,215,0.25), inset 0 0 0 1px rgba(255,255,255,0.5),
      0 1px 1px rgba(10,60,120,0.25), 0 4px 10px rgba(10,60,120,0.18);
  }
  .btn.primary, .add-frame {
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -4px 8px rgba(40,110,10,0.35), inset 0 0 0 1px rgba(255,255,255,0.4),
      0 1px 1px rgba(30,80,10,0.35), 0 6px 16px rgba(60,140,20,0.4);
  }
  .btn:active, .btn.primary:active, .add-frame:active {
    box-shadow: inset 0 3px 7px rgba(10,60,120,0.35), inset 0 -1px 0 rgba(255,255,255,0.6);
    transform: translateY(1px);
  }
  [aria-pressed="true"].tool, .seg button[aria-pressed="true"], .pill button[aria-pressed="true"], .chip[aria-pressed="true"], .chipb[aria-pressed="true"],
  .dlg .opts button[aria-pressed="true"], .side.open .side-tabs button[aria-selected="true"], .time.open .time-tab {
    box-shadow: inset 0 1px 0 #fff, inset 0 -4px 8px rgba(10,100,170,0.35), inset 0 0 0 1px rgba(255,255,255,0.45),
      0 1px 1px rgba(10,60,120,0.3), 0 4px 12px rgba(30,140,220,0.4) !important;
  }
  .chip, .chipb, .seg button, .pill button {
    background: var(--gel-white); border: 1px solid rgba(80,150,205,0.45);
    box-shadow: inset 0 1px 0 #fff, inset 0 -2px 4px rgba(70,150,215,0.2), 0 1px 2px rgba(10,60,120,0.15);
  }
  .tool svg, .btn svg, .mini svg { filter: drop-shadow(0 1px 0 rgba(255,255,255,0.9)) drop-shadow(0 1px 1px rgba(10,60,120,0.25)); }
  .logo .orb { box-shadow: inset 0 -4px 7px rgba(0,50,110,0.45), inset 0 3px 4px rgba(255,255,255,0.6), 0 3px 8px rgba(10,90,160,0.4), 0 0 0 1px rgba(255,255,255,0.9); }
  .logo span { background: linear-gradient(180deg, #2a7fc8, #0a3f73); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 1px 0 #fff); }

  /* the picture sits in a polished frame */
  .canvas-box {
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.95),
      0 0 0 4px rgba(150,205,240,0.9),
      0 0 0 5px rgba(60,130,190,0.55),
      0 3px 6px rgba(10,50,100,0.3),
      0 30px 70px rgba(5,40,90,0.45);
  }

  /* inset fields read as carved into the glass */
  .proj, select, .dlg textarea, .cw-hex, input[type=color] {
    background: linear-gradient(180deg, #eef6fc, #ffffff 40%);
    box-shadow: inset 0 2px 4px rgba(10,60,120,0.22), inset 0 -1px 0 rgba(255,255,255,0.9), 0 1px 0 rgba(255,255,255,0.8);
  }
  input[type=range] { filter: drop-shadow(0 1px 0 rgba(255,255,255,0.9)); }

  /* list rows, cards and thumbnails get depth */
  .list li, .lightbox, .cwd, .drop-hint {
    background-image: var(--noise), linear-gradient(180deg, rgba(255,255,255,0.85), rgba(232,246,255,0.65));
    box-shadow: inset 0 1px 0 #fff, inset 0 -6px 12px rgba(120,185,235,0.18), 0 2px 6px rgba(10,60,120,0.12);
  }
  .list li.sel { box-shadow: inset 0 1px 0 #fff, 0 0 0 2px rgba(29,155,230,0.35), 0 4px 10px rgba(29,155,230,0.25); }
  .frame { box-shadow: inset 0 1px 0 #fff, 0 3px 8px rgba(10,60,120,0.2); }
  .frame canvas { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6); }
  .bitem { box-shadow: inset 0 1px 0 #fff, 0 2px 5px rgba(10,60,120,0.15); }
  .cw-wheel { filter: drop-shadow(0 3px 6px rgba(10,60,120,0.3)); }
  .cw-swatch { box-shadow: inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -8px 14px rgba(255,255,255,0.25), 0 0 0 2px #fff, 0 2px 6px rgba(10,60,120,0.25); }
  .swatch-now, .sw { box-shadow: inset 0 3px 5px rgba(255,255,255,0.45), inset 0 -3px 5px rgba(0,0,0,0.2), 0 0 0 1px rgba(80,150,205,0.55), 0 2px 4px rgba(10,60,120,0.25); }
  .dlg { box-shadow: inset 0 1px 0 #fff, inset 0 -18px 30px rgba(110,180,235,0.25), 0 4px 8px rgba(10,60,120,0.2), 0 30px 80px rgba(5,40,90,0.45); }
  .toast { box-shadow: inset 0 1px 0 #fff, inset 0 -4px 8px rgba(10,100,170,0.3), 0 10px 26px rgba(10,60,120,0.35); }

  /* keep the backdrop (and its bubbles) strictly behind the animation picture */
  .aero-bg { z-index: 0; isolation: isolate; }
  .canvas-box { z-index: 1; }

  .view { background: linear-gradient(180deg, #020615 0%, #08133a 45%, #1c2665 72%, #43306f 100%); }

  /* day plaza fades into the night plaza over 12 seconds, once per visit */
  .aero-bg .sky-night { opacity: 0; animation: dusk 12s ease-in-out 0.6s forwards; }
  @keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .aero-bg .sky-night { animation: none; opacity: 1; } }

  .beditor summary { font-weight: 700; }
  .beditor .bprev { width: 100%; height: 60px; display: block; margin: 4px 0 6px; border-radius: 10px; background: #ffffff; box-shadow: inset 0 1px 4px rgba(10,60,120,0.2); }
  .beditor .bed-h { margin: 12px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: #2a6aa0; }

  .upd-frame { height: 46px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px;
    background: var(--gel-white); border: 1px solid rgba(80,150,205,0.55); color: var(--text); text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    box-shadow: inset 0 1px 0 #fff, inset 0 -3px 6px rgba(70,150,215,0.25), 0 6px 16px rgba(10,60,120,0.3); transition: opacity .2s, box-shadow .2s; }
  .upd-frame svg { width: 19px; height: 19px; }

    box-shadow: inset 0 1px 0 #fff, inset 0 -4px 8px rgba(170,70,0,0.3), 0 0 0 3px rgba(255,140,60,0.35), 0 6px 16px rgba(170,70,0,0.35); }
  .upd-frame.changed:active { transform: translateY(1px); }

  .cam-menu { position: absolute; z-index: 40; min-width: 190px; padding: 6px; border-radius: 14px; display: flex; flex-direction: column; gap: 2px; }
  .cam-menu[hidden] { display: none; }

  .cam-menu button { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; font-size: 14px; color: var(--text); text-align: left; }
  .cam-menu button:hover, .cam-menu button:focus-visible { background: var(--gel-aqua); }
  .cam-menu button svg { width: 18px; height: 18px; flex: 0 0 auto; }

  .cam-menu button.danger:hover { background: linear-gradient(180deg, #fff3f2, #ffd3cf); }

  .cam-pair .hop:last-child { border-radius: 0 999px 999px 0; border-left: 1px solid rgba(120,185,235,0.6); }

  /* touch controls for walking around (phones and tablets) */
  .flypad { position: absolute; left: 82px; right: 18px; bottom: 120px; z-index: 12; display: none; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .app.time-open .flypad { bottom: 300px; }
  .flypad.show { display: flex; }

    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.7), rgba(200,232,255,0.45)); border: 1px solid rgba(255,255,255,0.95);
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.8), inset 0 -8px 16px rgba(60,140,210,0.25), 0 8px 22px rgba(10,60,120,0.3); backdrop-filter: blur(8px); }

    box-shadow: inset 0 1px 0 #fff, inset 0 -4px 8px rgba(10,100,170,0.35), 0 4px 10px rgba(10,60,120,0.35); transition: transform 0.05s; }
  .flypad .ud { pointer-events: auto; display: flex; flex-direction: column; gap: 10px; }
  .flypad .ud button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(80,150,205,0.55); background: var(--gel-white); font-size: 20px; color: var(--text); touch-action: none;
    box-shadow: inset 0 1px 0 #fff, inset 0 -3px 6px rgba(70,150,215,0.25), 0 4px 12px rgba(10,60,120,0.3); }

  /* ---------- full-screen (immersive) mode: picture only, controls behind edge arrows */
  .edge-tab { display: none; position: absolute; z-index: 35; border: 1px solid rgba(255,255,255,0.95); color: #24507a; padding: 0; place-items: center;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 #fff, 0 6px 18px rgba(20,90,150,0.3); transition: left .25s ease, top .25s ease; }
  .edge-tab svg { width: 20px; height: 20px; transition: transform .25s ease; }

  .edge-top { top: 0; left: 50%; width: 84px; height: 30px; margin-left: -42px; border-top: 0; border-radius: 0 0 14px 14px; }
  .app.immersive .edge-tab { display: grid; }

  .app.immersive .side { top: 10px; bottom: 44px; }

  .app.immersive .side.open .side-tabs button::before { content: "›"; }

  .app.immersive .flypad { left: 40px; }

  /* =====================================================================
     Bubble glass: clear, see-through panels and buttons with reflections
     ===================================================================== */
  :root {
    --bubble-hi: radial-gradient(120% 80% at 16% 6%, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.16) 20%, rgba(255,255,255,0) 38%);
    --bubble-win: radial-gradient(55% 22% at 72% 7%, rgba(255,255,255,0.42), rgba(255,255,255,0) 72%);
    --bubble-iri: linear-gradient(135deg, rgba(255,255,255,0) 52%, rgba(150,255,235,0.14) 68%, rgba(255,160,235,0.16) 84%, rgba(255,240,170,0.10) 94%, rgba(255,255,255,0) 100%);
    --bubble-low: radial-gradient(140% 120% at 50% 125%, rgba(110,195,255,0.30), rgba(110,195,255,0) 60%);
    --glass: var(--bubble-hi), var(--bubble-win), var(--bubble-iri), var(--bubble-low), rgba(255,255,255,0.2);
    --gel-white: radial-gradient(90% 70% at 30% 18%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.18) 38%, rgba(255,255,255,0) 60%),
      radial-gradient(120% 90% at 70% 120%, rgba(120,200,255,0.32), rgba(120,200,255,0) 60%),
      linear-gradient(135deg, rgba(255,255,255,0) 55%, rgba(170,255,240,0.18) 75%, rgba(255,170,240,0.18) 92%), rgba(255,255,255,0.22);
    --gel-aqua: radial-gradient(90% 70% at 30% 18%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 38%, rgba(255,255,255,0) 60%),
      radial-gradient(120% 90% at 70% 120%, rgba(60,170,255,0.55), rgba(60,170,255,0) 65%), rgba(90,190,255,0.38);
    --gel-lime: radial-gradient(90% 70% at 30% 18%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 38%, rgba(255,255,255,0) 60%),
      radial-gradient(120% 90% at 70% 120%, rgba(120,220,60,0.6), rgba(120,220,60,0) 65%), rgba(170,240,110,0.42);
    --bubble-rim: inset 0 0 0 1px rgba(255,255,255,0.3), inset 0 2px 1px rgba(255,255,255,0.85), inset 0 0 26px rgba(255,255,255,0.2), inset 0 -10px 22px rgba(80,175,255,0.24);
    --text: #072340;
  }
  .glass, .dlg, .cam-menu, .rh-card {
    background: var(--glass) !important;
    border: 1px solid rgba(255,255,255,0.78) !important;
    box-shadow: var(--bubble-rim), 0 12px 34px rgba(5,45,100,0.22) !important;
    backdrop-filter: blur(16px) saturate(1.7) brightness(1.1) !important;
    -webkit-backdrop-filter: blur(16px) saturate(1.7) brightness(1.1) !important;
  }
  .top.glass, .tools.glass { border-radius: 26px; }
  .side.glass { border-radius: 26px 0 0 26px; }
  .time.glass { border-radius: 26px 26px 0 0; }
  .dlg { border-radius: 28px; }
  /* a curved window glint on every bubble panel */
  .glass::after, .dlg::after {
    content: ""; position: absolute; pointer-events: none; z-index: 3;
    top: 7px; left: 16px; width: min(38%, 220px); height: 14px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
    opacity: 0.75; filter: blur(0.4px);
  }
  .dlg { position: relative; }
  .tools.glass::after { width: 26px; left: 10px; }

  /* readable text over anything behind the glass */

  .dlg .opts button[aria-pressed="true"], .side.open .side-tabs button[aria-selected="true"], .time.open .time-tab {

  }

  /* fields become clear bubbles */

  .list li, .lightbox, .cwd, .drop-hint, .frame {

  .sw, .swatch-now { box-shadow: inset 4px 5px 6px rgba(255,255,255,0.6), inset -3px -4px 6px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.85), 0 2px 6px rgba(5,45,100,0.25) !important; }

body.bg-off .fly-help, body.bg-off .pill {
  background: var(--glass) !important; color: #f6edff !important; text-shadow: 0 1px 3px rgba(20,0,40,0.9) !important;
  border: 1px solid rgba(220,170,255,0.7) !important; box-shadow: inset 0 1px 0 rgba(255,225,255,0.7), inset 0 -8px 16px rgba(150,70,255,0.3), 0 0 16px rgba(150,70,255,0.25) !important;
}
body.bg-off .pill .lab { color: #f6edff !important; }
body.bg-off .upd-frame:disabled { opacity: 0.75; }
.list li { gap: 4px; }
.list li .mini { width: 27px; height: 27px; }
.list .nm small { display: block; margin: 1px 0 0; font-size: 11px; }
/* timeline open: keep the frame buttons clear of the Timeline tab */
@media (min-height: 501px) { .app.time-open .hud.bc { bottom: 288px; } }
@media (min-height: 501px) and (max-width: 900px) { .app.time-open .hud.bc { bottom: 256px; } }

/* ---------- projects & account */
.proj-btn { font-weight: 800; color: #c2185b !important; background: radial-gradient(90% 70% at 30% 18%, rgba(255,255,255,0.95), rgba(255,255,255,0.3) 45%, rgba(255,255,255,0) 62%), radial-gradient(120% 90% at 70% 120%, rgba(255,120,190,0.55), rgba(255,120,190,0) 62%), rgba(255,215,235,0.75) !important; border-color: rgba(255,170,210,0.95) !important; }
.proj-btn .lbl { display: inline !important; }
#app.bg-off .proj-btn, body.bg-off .proj-btn { color: #fff !important; }
.dlg.wide { width: min(860px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.dlg.wide .pgrid { overflow: auto; min-height: 0; flex: 1; padding: 4px; margin: -4px; }
.dlg.wide .acts { flex-shrink: 0; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.pwrap { position: relative; }
.pcard { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.95); text-align: left; cursor: pointer; color: inherit; font: inherit;
  background: radial-gradient(120% 70% at 25% 0%, rgba(255,255,255,0.85), rgba(255,255,255,0.25) 50%), rgba(220,240,255,0.5); box-shadow: inset 0 1px 0 #fff, inset 0 -10px 20px rgba(110,180,235,0.2), 0 4px 12px rgba(10,60,120,0.15); }
.pcard:hover { box-shadow: inset 0 1px 0 #fff, 0 0 0 2px rgba(60,170,255,0.6), 0 6px 16px rgba(10,60,120,0.2); }
.pcard.cur { box-shadow: inset 0 1px 0 #fff, 0 0 0 3px rgba(255,120,190,0.75), 0 6px 16px rgba(10,60,120,0.2); }
.pcard img, .pcard .pthumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: linear-gradient(180deg, #cfeaff, #eaf6ff); }
.pname { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 30px; }
.pmeta { font-size: 12px; opacity: 0.75; }
.pcard.cur .pmeta { color: #c2185b; opacity: 1; font-weight: 700; }
.pwrap > .mini { position: absolute; right: 8px; bottom: 10px; }
.acct-form { display: flex; flex-direction: column; gap: 10px; }
.acct-in { width: 100%; max-width: none !important; font-size: 16px; }
.acct-err { color: #c62828; font-weight: 700; min-height: 1em; margin: 0; }
body.bg-off .acct-err { color: #ffb4c8; }
body.bg-off .pcard { background-color: rgba(110,45,190,0.35) !important; border-color: rgba(220,170,255,0.6); }
@media (max-width: 600px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .pname { font-size: 13px; } .pmeta { font-size: 11px; } }
</style>

<body>
<div class="app" id="app">
  <header class="top glass">
    <div class="logo"><i class="orb" aria-hidden="true"></i><span>Heemb4by</span></div>
    <a class="credit" href="https://www.instagram.com/nyheimb/" target="_blank" rel="noopener" title="Heemb4by on Instagram">@nyheimb</a>
    <label class="sr" for="projName">Project name</label>
    <input class="proj" id="projName" value="My animation" maxlength="40" autocomplete="off">
    <button class="btn proj-btn" id="projectsBtn" title="All your saved projects (up to 10)"><span class="lbl">projectsbby&lt;3</span></button>
    <button class="btn primary" id="exportBtn" title="Save your animation as a video or a picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Export</span></button>

    <button class="btn icon" id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon" id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <div class="grow"></div>
    <span class="status" id="saveStatus">Not saved yet</span>

      <span class="lbl">Import 3D</span>
      <input type="file" id="modelInput" multiple aria-label="Import 3D models">
    </label>
    <label class="btn file-btn" title="Import a photo or video as a new layer in the 3D scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>

    </label>

      <span class="lbl" id="bgLabel">Background off</span>

glow)"/><path d="M777.9 61.0 L782.6 61.0 L782.3 79.0 L777.5 79.0 Z" fill="#ffb347" filter="url(#glow)"/><path d="M810.7 381.0 L817.3 381.0 L817.7 399.0 L811.0 399.0 Z" fill="#ffc46b" filter="url(#glow)"/><path d="M779.2 281.0 L785.2 281.0 L785.0 299.0 L778.9 299.0 Z" fill="#ffd08a" filter="url(#glow)"/><path d="M791.6 161.0 L796.9 161.0 L796.9 179.0 L791.5 179.0 Z" fill="#ffb347" filter="url(#glow)"/><path d="M747.6 101.0 L752.5 101.0 L751.5 119.0 L746.5 119.0 Z" fill="#ffb347" filter="url(#glow)"/><path d="M815.8 81.0 L820.6 81.0 L821.3 99.0 L816.3 99.0 Z" fill="#ffc46b" filter="url(#glow)"/><path d="M737.2 281.0 L743.2 281.0 L742.2 299.0 L736.0 299.0 Z" fill="#ffd08a" filter="url(#glow)"/><path d="M726.1 361.0 L732.6 361.0 L731.4 379.0 L724.8 379.0 Z" fill="#ffb347" filter="url(#glow)"/><path d="M803.7 341.0 L810.1 341.0 L810.4 359.0 L803.9 359.0 Z" fill="#ffb347" filter="url(#glow)"/><path d="M830.1 201.0 L835.6 201.0 L836.5 219.0 L830.9 219.0 Z" fill="#ffc46b" filter="url(#glow)"/><rect x="1268" y="128" width="46" height="40" rx="3" fill="#ff9a2e" opacity=".6" filter="url(#bigglow)"/><rect x="1270" y="130" width="42" height="36" rx="2" fill="url(#litBand)"/><line x1="1291" y1="130" x2="1291" y2="166" stroke="#7a3a10" stroke-opacity=".5" stroke-width="2"/><path d="M196 430 L222 430 L700 900 L250 900 Z" fill="url(#beam)" filter="url(#soft)"/><ellipse cx="440" cy="860" rx="270" ry="60" fill="url(#warmPool)"/><circle cx="208" cy="426" r="40" fill="#ffb24a" opacity=".55" filter="url(#bigglow)"/><rect x="198" y="418" width="20" height="11" rx="3" fill="#fff4d6"/><path d="M330 900 L520 760 L600 760 L470 900 Z" fill="#ffb24a" opacity=".18" filter="url(#softer)"/><path d="M1150 660 Q1350 570 1600 600" stroke="#b6ff5a" stroke-width="10" fill="none" opacity=".45" filter="url(#bigglow)"/><path d="M674 640 L730 38 L742 40 L700 640 Z" fill="#b6ff5a" opacity=".35" filter="url(#bigglow)"/><rect width="1600" height="900" fill="url(#vig)"/></svg>
      <span class="bub b1"></span><span class="bub b2"></span><span class="bub b3"></span><span class="bub b4"></span><span class="bub b5"></span><span class="bub b6"></span>
    </div>
    <div class="canvas-box" id="box">
      <div class="loading" id="loading" style="position:absolute;inset:0;display:grid;place-items:center">Loading 3D…</div>
      <canvas id="draw" aria-label="Drawing canvas"></canvas>
      <span class="hop-tag" id="hopTag" aria-live="polite"></span>
    </div>
    <div class="hud tl">
      <div class="pill" role="group" aria-label="Camera mode">
        <button type="button" id="modeOrbit" aria-pressed="true">Orbit</button>
        <button type="button" id="modeFly" aria-pressed="false">Walk / fly</button>
      </div>
      <div class="cam-pair">
      <button type="button" class="hop" id="hopBtn" aria-pressed="false" title="Look through a scene camera (H). Click a camera in the picture for more options.">Hop in camera</button>
      <button type="button" class="hop" id="newCamBtn" title="Add a new camera at this view (C)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="m15 11 5-3v8l-5-3"/><path d="M9 10v4M7 12h4"/></svg>Add camera
      </button>
      </div>
      <span class="fly-help" id="flyHelp">Drag to look · WASD move · Q/E down/up · Shift faster</span>
    </div>
    <div class="cam-menu glass" id="camMenu" role="menu" aria-label="Camera options" hidden></div>
    <div class="hud tr">
      <div class="pill"><span class="lab" id="frameLabel">Frame 1 / 1</span></div>
    </div>
    <div class="hud bc">
      <button type="button" class="mini-play" id="hudPrev" aria-label="Previous frame"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5v14L6 12z"/></svg></button>
      <button type="button" class="mini-play" id="hudPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
      <button type="button" class="mini-play" id="hudNext" aria-label="Next frame"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg></button>
      <button type="button" class="add-frame" id="addFrameBtn" title="Add a frame from this camera view (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="m17 10 4-2v8l-4-2"/><path d="M10 9v6M7 12h6"/></svg>
        <span class="long">Add frame here</span><span class="short">Add frame</span>
      </button>
      <button type="button" class="upd-frame" id="updateCamBtn" disabled title="Save the current camera view to this frame (U)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        <span class="long">Update frame</span><span class="short">Update</span>
      </button>
    </div>
  </main>

  <aside class="side glass" id="side">
    <div class="side-tabs" role="tablist" aria-label="Panels">
      <button type="button" role="tab" id="tabBrush" aria-selected="true" aria-expanded="false" aria-controls="paneBrush" title="Brush (B)">Brush</button>
      <button type="button" role="tab" id="tabLayers" aria-selected="false" aria-expanded="false" aria-controls="paneLayers" title="Layers (L)">Layers</button>
      <button type="button" role="tab" id="tabScene" aria-selected="false" aria-expanded="false" aria-controls="paneScene" title="3D scene (G)">3D scene</button>
    </div>
    <div class="side-head">
      <h2 id="sideTitle">Brush</h2>
      <button type="button" class="btn icon" id="sideClose" aria-label="Close panel (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <section class="pane on" id="paneBrush" role="tabpanel" aria-labelledby="tabBrush"></section>
    <section class="pane" id="paneLayers" role="tabpanel" aria-labelledby="tabLayers"></section>
    <section class="pane" id="paneScene" role="tabpanel" aria-labelledby="tabScene"></section>
  </aside>

  <section class="time glass" id="time" aria-label="Timeline">
    <button type="button" class="time-tab" id="timeTab" aria-expanded="false" aria-controls="time" title="Timeline (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      <span>Timeline</span><span id="timeTabCount" style="opacity:.7;font-weight:600"></span>
    </button>
    <div class="tbar">
      <button class="btn icon" id="firstBtn" aria-label="First frame"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn icon" id="prevBtn" aria-label="Previous frame (,)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5v14L6 12z"/></svg></button>
      <button class="btn primary icon" id="playBtn" aria-label="Play (Space)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="btn icon" id="nextBtn" aria-label="Next frame (.)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg></button>
      <label>FPS <select id="fps"><option>6</option><option>8</option><option selected>12</option><option>15</option><option>24</option><option>30</option></select></label>
      <label><input type="checkbox" id="loop" checked> Loop</label>
      <label><input type="checkbox" id="onion"> Onion skin</label>
      <span class="sep"></span>
      <button class="btn" id="dupBtn" title="Duplicate frame (drawings and camera)"><span>Duplicate</span></button>
      <button class="btn" id="tweenBtn" title="Add in-between frames with a smooth camera move to the next frame"><span>In-betweens</span></button>
      <button class="btn icon" id="moveLBtn" aria-label="Move frame left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="btn icon" id="moveRBtn" aria-label="Move frame right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn" id="delFrameBtn" title="Delete frame"><span>Delete</span></button>
    </div>
    <div class="strip" id="strip" role="listbox" aria-label="Frames"></div>
  </section>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
